<style>
/* ══════════════════════════════
   ZOE — CHATBOT PROWELD MOBILE
   Couleurs: #0F2F5F + #F37021
══════════════════════════════ */
:root{
  --navy:#0F2F5F;
  --navy2:#0A2248;
  --o:#F37021;
  --od:#D4601A;
  --w:#EEF3F8;
  --sl:#B8CCDC;
  --bg:#0B1420;
  --bg2:#0E1929;
  --bs:rgba(255,255,255,.07);
  --rad:14px;
  --skin:#F0C896;
  --skin2:#E0A870;
  --hair:#2A1A08;
}

/* ══ BOUTON FLOTTANT ══ */
#zoe-trigger{
  position:fixed;
  bottom:28px;
  right:28px;
  width:72px;
  height:72px;
  border-radius:50%;
  cursor:pointer;
  z-index:9998;
  border:none;
  background:none;
  padding:0;
  filter:drop-shadow(0 4px 20px rgba(243,112,33,.5));
  animation:zoePulse 3s ease-in-out infinite;
  transition:transform .2s;
}
#zoe-trigger:hover{transform:scale(1.08)}
#zoe-trigger.open{animation:none;transform:scale(1)}

@keyframes zoePulse{
  0%,100%{filter:drop-shadow(0 4px 18px rgba(243,112,33,.45))}
  50%{filter:drop-shadow(0 4px 28px rgba(243,112,33,.8))}
}

/* Badge notif */
#zoe-badge{
  position:absolute;
  top:-2px;
  right:-2px;
  width:20px;
  height:20px;
  background:var(--o);
  border-radius:50%;
  border:2px solid var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Barlow Condensed',sans-serif;
  font-size:.7rem;
  font-weight:900;
  color:#fff;
  animation:badgePop .4s ease .8s both;
}
@keyframes badgePop{
  from{transform:scale(0)}
  to{transform:scale(1)}
}

/* ══ FENÊTRE CHAT ══ */
#zoe-window{
  position:fixed;
  bottom:112px;
  right:28px;
  width:360px;
  max-height:580px;
  background:var(--bg2);
  border:1px solid rgba(243,112,33,.2);
  border-radius:var(--rad);
  box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
  z-index:9999;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  opacity:0;
  transform:translateY(16px) scale(.96);
  pointer-events:none;
  transition:opacity .3s, transform .3s;
}
#zoe-window.visible{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:all;
}

/* Header */
#zoe-header{
  background:linear-gradient(135deg, var(--navy2) 0%, var(--navy) 100%);
  padding:16px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:1px solid rgba(243,112,33,.15);
  flex-shrink:0;
}
#zoe-avatar-sm{
  width:48px;
  height:48px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid var(--o);
  flex-shrink:0;
  background:var(--navy);
}
.zoe-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:1.1rem;
  font-weight:800;
  color:var(--w);
  letter-spacing:.04em;
}
.zoe-status{
  font-size:.74rem;
  color:var(--o);
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:1px;
}
.zoe-dot{
  width:6px;height:6px;
  background:#4ade80;
  border-radius:50%;
  animation:statusBlink 2s ease-in-out infinite;
}
@keyframes statusBlink{0%,100%{opacity:1}50%{opacity:.4}}
#zoe-close{
  margin-left:auto;
  background:rgba(255,255,255,.08);
  border:none;
  color:var(--sl);
  width:28px;height:28px;
  border-radius:50%;
  cursor:pointer;
  font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;
  flex-shrink:0;
}
#zoe-close:hover{background:rgba(243,112,33,.2);color:var(--o)}

/* Corps messages */
#zoe-body{
  flex:1;
  overflow-y:auto;
  padding:18px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  scrollbar-width:thin;
  scrollbar-color:rgba(243,112,33,.2) transparent;
}

/* Bulles */
.msg{
  max-width:84%;
  font-size:.88rem;
  line-height:1.55;
  animation:msgIn .25s ease both;
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
.msg.zoe{align-self:flex-start}
.msg.user{align-self:flex-end}
.msg-bubble{
  padding:10px 14px;
  border-radius:var(--rad);
}
.msg.zoe .msg-bubble{
  background:rgba(15,47,95,.6);
  border:1px solid rgba(15,47,95,.9);
  color:var(--w);
  border-bottom-left-radius:4px;
}
.msg.user .msg-bubble{
  background:var(--o);
  color:#fff;
  border-bottom-right-radius:4px;
  font-weight:500;
}
.msg-name{
  font-size:.68rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--o);
  margin-bottom:4px;
}

/* Typing indicator */
#zoe-typing{
  align-self:flex-start;
  padding:10px 16px;
  background:rgba(15,47,95,.6);
  border:1px solid rgba(15,47,95,.9);
  border-radius:var(--rad);
  border-bottom-left-radius:4px;
  display:none;
  gap:4px;
  align-items:center;
}
#zoe-typing.show{display:flex}
.dot-t{width:7px;height:7px;background:var(--sl);border-radius:50%;animation:typeDot 1.2s ease-in-out infinite}
.dot-t:nth-child(2){animation-delay:.2s}
.dot-t:nth-child(3){animation-delay:.4s}
@keyframes typeDot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}

/* Boutons choix */
.choices{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:4px;
  align-self:flex-start;
  max-width:90%;
}
.choice-btn{
  background:rgba(243,112,33,.1);
  border:1px solid rgba(243,112,33,.3);
  color:var(--o);
  padding:7px 13px;
  border-radius:20px;
  font-family:'Barlow',sans-serif;
  font-size:.82rem;
  font-weight:600;
  cursor:pointer;
  transition:all .18s;
  white-space:nowrap;
}
.choice-btn:hover{background:rgba(243,112,33,.25);border-color:var(--o);transform:translateY(-1px)}
.choice-btn:active{transform:scale(.97)}

/* Footer */
#zoe-footer{
  padding:12px 16px;
  border-top:1px solid var(--bs);
  flex-shrink:0;
}
#zoe-wa-btn{
  width:100%;
  background:rgba(37,211,102,.12);
  border:1px solid rgba(37,211,102,.3);
  color:#25D366;
  padding:11px 16px;
  border-radius:8px;
  font-family:'Barlow',sans-serif;
  font-size:.85rem;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:all .2s;
  text-decoration:none;
}
#zoe-wa-btn:hover{background:rgba(37,211,102,.22);border-color:#25D366}

/* Mobile */

    max-height:100dvh;
    border-radius:var(--rad) var(--rad) 0 0;
    bottom:0;
  }
  #zoe-trigger{bottom:20px;right:20px}

    choices:['🔴 Aujourd\'hui / Urgent','📅 Cette semaine','🗓️ Planifié'],
    key:'urgence'
  },
  {
    id:'plans',
    msg:"Avez-vous besoin de plans 2D/3D ou de calculs d'ingénierie?",
    choices:['✅ Oui, avec plans','❌ Non, travail direct'],
    key:'plans'
  }
];

function toggleZoe(){
  isOpen = !isOpen;
  const w = document.getElementById('zoe-window');
  const t = document.getElementById('zoe-trigger');
  const b = document.getElementById('zoe-badge');

  if(isOpen){
    w.classList.add('visible');
    t.classList.add('open');
    if(b) b.style.display = 'none';
    if(step === 0) startConversation();
  } else {
    w.classList.remove('visible');
    t.classList.remove('open');
  }
}

function startConversation(){
  // Message de bienvenue
  setTimeout(()=>{
    addZoeMsg(flow[0].msg);
    setTimeout(()=>{
      step = 1;
      showStep(1);
    }, 1200);
  }, 400);
}

function showStep(s){
  if(s >= flow.length){
    showConclusion();
    return;
  }
  const f = flow[s];
  showTyping();
  setTimeout(()=>{
    hideTyping();
    addZoeMsg(f.msg);
    if(f.choices){
      setTimeout(()=>addChoices(f.choices, s), 300);
    }
  }, 900);
}

function addZoeMsg(text){
  const body = document.getElementById('zoe-body');
  const div = document.createElement('div');
  div.className = 'msg zoe';
  div.innerHTML = `<div class="msg-name">ZOE</div><div class="msg-bubble">${text}</div>`;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function addUserMsg(text){
  const body = document.getElementById('zoe-body');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="msg-bubble">${text}</div>`;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function addChoices(choices, stepIndex){
  const body = document.getElementById('zoe-body');
  const div = document.createElement('div');
  div.className = 'choices';
  div.id = 'choices-' + stepIndex;
  choices.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = ()=>selectChoice(c, stepIndex, div);
    div.appendChild(btn);
  });
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function selectChoice(choice, stepIndex, choicesDiv){
  // Sauvegarder réponse
  const key = flow[stepIndex].key;
  userData[key] = choice;

  // Supprimer les boutons
  choicesDiv.remove();

  // Afficher réponse utilisateur
  addUserMsg(choice);

  // Étape suivante
  step = stepIndex + 1;
  setTimeout(()=>showStep(step), 400);
}

function showConclusion(){
  const isUrgent = userData.urgence && userData.urgence.includes('Aujourd');
  showTyping();
  setTimeout(()=>{
    hideTyping();
    const recap = `Merci! Voici ce que j'ai noté:\n• ${userData.type_client || ''} · ${userData.type_travail || ''}\n• Zone: ${userData.zone || ''}\n• ${userData.urgence || ''}`;
    addZoeMsg(recap.replace(/\n/g,'<br>'));

    setTimeout(()=>{
      showTyping();
      setTimeout(()=>{
        hideTyping();
        if(isUrgent){
          addZoeMsg("⚡ C'est urgent! Je vous transfère directement à Javier via WhatsApp — il répond en moins de 5 minutes.");
          setTimeout(()=>{
            // Highlight bouton WhatsApp
            const waBtn = document.getElementById('zoe-wa-btn');
            waBtn.style.background = 'rgba(37,211,102,.3)';
            waBtn.style.borderColor = '#25D366';
            waBtn.style.boxShadow = '0 0 0 3px rgba(37,211,102,.2)';
            waBtn.innerHTML = waBtn.innerHTML.replace('WhatsApp direct','👆 CLIQUEZ — WhatsApp direct');
          }, 300);
        } else {
          addZoeMsg("Parfait! Je vous oriente vers notre formulaire de soumission. Javier vous contacte dans les 24h. 🙂");
          setTimeout(()=>{
            addChoices(['📋 Formulaire de soumission','💬 WhatsApp quand même'], 99);
            // Gérer ces boutons spéciaux
            setTimeout(()=>{
              document.querySelectorAll('.choices:last-child .choice-btn').forEach(btn=>{
                btn.onclick = ()=>{
                  if(btn.textContent.includes('Formulaire')){
                    window.open('https://proweldmobile.ca/proweld-soumission.html','_blank');
                  } else {
                    window.open('https://wa.me/15813726673','_blank');
                  }
                };
              });
            }, 100);
          }, 400);
        }
      }, 1000);
    }, 600);
  }, 1000);
}

function showTyping(){
  document.getElementById('zoe-typing').classList.add('show');
  const body = document.getElementById('zoe-body');
  body.scrollTop = body.scrollHeight;
}
function hideTyping(){
  document.getElementById('zoe-typing').classList.remove('show');
}
</script>
</body>
</html>
